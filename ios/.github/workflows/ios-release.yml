name: iOS Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        required: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Decode distribution certificate
        run: |
          echo "${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Write App Store Connect API key
        run: |
          cat > asc_api_key.json << 'EOF'
          {
            "key_id": "${{ secrets.ASC_KEY_ID }}",
            "issuer_id": "${{ secrets.ASC_ISSUER_ID }}",
            "key": "${{ secrets.ASC_PRIVATE_KEY }}",
            "in_house": false
          }
          EOF

      - name: Run Fastlane beta lane
        env:
          CI: "true"
          CERTIFICATE_PATH: ${{ github.workspace }}/certificate.p12
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_PATH: ${{ github.workspace }}/profile.mobileprovision
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_KEY_PATH: ${{ github.workspace }}/asc_api_key.json
        run: bundle exec fastlane ios beta

      - name: Clean up secrets
        if: always()
        run: rm -f certificate.p12 profile.mobileprovision asc_api_key.json
